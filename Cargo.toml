[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/security",
  "crates/persistence",
  "crates/discovery",
  "crates/capabilities",
  "crates/system-control",
  "desktop/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ccontrol-protocol = { path = "crates/protocol" }
ccontrol-security = { path = "crates/security" }
ccontrol-persistence = { path = "crates/persistence" }
ccontrol-discovery = { path = "crates/discovery" }
ccontrol-capabilities = { path = "crates/capabilities" }
ccontrol-system-control = { path = "crates/system-control" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
