[package]
name = "ccontrol-system-control"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native OS adapters (audio volume, media keys, telemetry) behind one trait"

[dependencies]
ccontrol-protocol.workspace = true
thiserror.workspace = true
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Power",
  "Foundation",
  "Media_Control",
] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
