[package]
name = "ccontrol-security"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device identity, mutually-authenticated TLS configuration, pairing SAS"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto"] }
x509-parser = "0.16"
sha2.workspace = true
hex.workspace = true
rand.workspace = true
thiserror.workspace = true
subtle = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
